services:
  exp_neo4j:
    image: neo4j:5.15.0
    container_name: exp-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"  # HTTP Browser
      - "7687:7687"  # Bolt Protocol
    environment:
      NEO4J_AUTH: "neo4j/ridwan-8-chars"

      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_dbms_security_allow__csv__import__from__file__urls: "true"

      NEO4J_dbms_directories_import: "/import"
      NEO4J_server_default__listen__address: "0.0.0.0"

      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "2G"
      NEO4J_server_memory_pagecache_size: "1G"


      NEO4J_db_transaction_timeout: "120s"

      NEO4J_server_logs_debug_enabled: "true"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_conf:/conf
      - ./neo4j/import:/import        # <-- bind mount (only this one)
      - neo4j_plugins:/plugins
    networks:
      - exp_network
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p 'ridwan-8-chars' 'RETURN 1'"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 20s

  exp_neodash:
    image: neo4jlabs/neodash:2.4.4
    platform: linux/amd64
    container_name: exp-neodash
    restart: unless-stopped
    ports:
      - "5005:5005"
    environment:
      NEODASH_SERVER_PORT: "5005"
      ssoEnabled: "false"
    depends_on:
      exp_neo4j:
        condition: service_healthy
    volumes:
      - neodash_data:/data
    networks:
      - exp_network


  data-loader:
    build: . 
    container_name: data-loader
    restart: "no"
    volumes:
      - ./scripts:/scripts
      - ./data:/data
      - ./neo4j/import:/import
    working_dir: /scripts
    depends_on:
      exp_neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: "bolt://exp-neo4j:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASSWORD: "ridwan-8-chars"
      DATA_PATH : "../data"
      BATCH_SIZE : 100
    networks:
      - exp_network

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
  neodash_data:
  neo4j_conf:


networks:
  exp_network:
    driver: bridge
    name: exp-network